{% extends 'base.html' %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('employees.index') }}" class="btn btn-outline-secondary me-3">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h2 class="mb-0"><i class="fas fa-user-plus me-2 text-primary"></i>Add New Employee</h2>
</div>

<div class="card border-0 shadow-sm" style="max-width:800px">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('employees.add') }}" id="add-employee-form">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Employee ID <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="employee_id" id="employee_id"
                           placeholder="EMP001" maxlength="6"
                           value="{{ form_data.get('employee_id', '') }}">
                    <div class="form-text">Format: EMP + 3 digits (e.g. EMP001)</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Employee Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" id="emp_name"
                           placeholder="Full Name" maxlength="50"
                           value="{{ form_data.get('name', '') }}">
                    <div class="form-text">2–50 characters</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="department" id="department"
                           placeholder="e.g. Engineering"
                           value="{{ form_data.get('department', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Designation <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="designation" id="designation"
                           placeholder="e.g. Software Engineer"
                           value="{{ form_data.get('designation', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" id="email"
                           placeholder="name@company.com"
                           value="{{ form_data.get('email', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="phone" id="phone"
                           placeholder="10-digit mobile number"
                           value="{{ form_data.get('phone', '') }}">
                    <div class="form-text">10 digits, starting with 6/7/8/9</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Date of Joining <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="date_of_joining" id="date_of_joining"
                           value="{{ form_data.get('date_of_joining', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Basic Salary (₹) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="basic_salary" id="basic_salary"
                           placeholder="10000 to 500000" min="0"
                           value="{{ form_data.get('basic_salary', '') }}">
                    <div class="form-text">Valid range: ₹10,000 – ₹5,00,000</div>
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary me-2" id="submit-add-emp">
                        <i class="fas fa-save me-1"></i>Save Employee
                    </button>
                    <a href="{{ url_for('employees.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
