{% extends 'base.html' %}
{% block title %}Record Attendance{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('attendance.index') }}" class="btn btn-outline-secondary me-3">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h2 class="mb-0"><i class="fas fa-calendar-plus me-2 text-success"></i>Record Attendance</h2>
</div>

<div class="card border-0 shadow-sm" style="max-width:700px">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('attendance.add') }}" id="add-attendance-form">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label fw-semibold">Employee <span class="text-danger">*</span></label>
                    <select class="form-select" name="employee_id" id="att_employee_id">
                        <option value="">— Select Employee —</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}" {{ 'selected' if form_data.get('employee_id', '') == emp.id|string }}>
                            {{ emp.employee_id }} — {{ emp.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Month <span class="text-danger">*</span></label>
                    <select class="form-select" name="month" id="att_month">
                        <option value="">— Select Month —</option>
                        {% for num, name in months %}
                        <option value="{{ num }}" {{ 'selected' if form_data.get('month', '') == num|string }}>
                            {{ name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="year" id="att_year"
                           placeholder="e.g. 2026" min="2020" max="2030"
                           value="{{ form_data.get('year', '2026') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Working Days <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="working_days" id="working_days"
                           placeholder="1–31" min="1" max="31"
                           value="{{ form_data.get('working_days', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Present Days <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="present_days" id="present_days"
                           placeholder="0–Working Days" min="0"
                           value="{{ form_data.get('present_days', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Leave Days <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="leave_days" id="leave_days"
                           placeholder="0–Working Days" min="0"
                           value="{{ form_data.get('leave_days', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Overtime Hours</label>
                    <input type="number" class="form-control" name="overtime_hours" id="overtime_hours"
                           placeholder="0–100" min="0" max="100" step="0.5"
                           value="{{ form_data.get('overtime_hours', '0') }}">
                    <div class="form-text">Max 100 hours/month</div>
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-success me-2" id="submit-att">
                        <i class="fas fa-save me-1"></i>Save Attendance
                    </button>
                    <a href="{{ url_for('attendance.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
