<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes march { to { stroke-dashoffset: -40; } }
    @keyframes pulse {
      0% { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
      50% { filter: drop-shadow(0 15px 15px rgba(26,188,156,0.4)); }
      100% { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
    }
    .box { fill: #1e3c72; rx: 15; ry: 15; animation: pulse 3s infinite; }
    .box-back { fill: #2a5298; }
    .box-db { fill: #003B57; }
    .title { fill: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; }
    .subtitle { fill: #a1c4fd; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; text-anchor: middle; }
    .line { stroke: #3498db; stroke-width: 4px; fill: none; stroke-dasharray: 12, 12; animation: march 1.5s linear infinite; }
    .label { fill: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
  </style>
  
  <rect width="100%" height="100%" fill="#f4f7f6" rx="20" ry="20" />

  <!-- Paths -->
  <path d="M 230 150 L 340 150" class="line" />
  <path d="M 460 150 L 570 150" class="line" />

  <!-- Labels -->
  <text x="285" y="140" class="label">HTTP GET/POST</text>
  <text x="515" y="140" class="label">ORM Queries</text>

  <!-- Frontend -->
  <g transform="translate(50, 85)">
    <rect width="180" height="130" class="box" />
    <text x="90" y="55" class="title">Frontend UI</text>
    <text x="90" y="80" class="subtitle">HTML5 / CSS / Jinja</text>
    <text x="90" y="105" class="subtitle">Glassmorphism</text>
  </g>

  <!-- Backend -->
  <g transform="translate(340, 85)">
    <rect width="120" height="130" class="box box-back" />
    <text x="60" y="55" class="title">Flask API</text>
    <text x="60" y="80" class="subtitle">Controllers</text>
    <text x="60" y="105" class="subtitle">&amp; Services</text>
  </g>

  <!-- Database -->
  <g transform="translate(570, 85)">
    <rect width="180" height="130" class="box box-db" />
    <text x="90" y="55" class="title">SQLite DB</text>
    <text x="90" y="80" class="subtitle">SQLAlchemy ORM</text>
    <text x="90" y="105" class="subtitle">Relational Data</text>
  </g>
</svg>
