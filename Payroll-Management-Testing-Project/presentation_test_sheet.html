<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Test Case Sheet - Team 11</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .header-banner {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 40px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        .badge-pass { background-color: #11998e; }
        .badge-fail { background-color: #e74c3c; }
        
        table.dataTable thead {
            background-color: #f8f9fa;
        }
        table.dataTable thead th {
            border-bottom: 2px solid #dee2e6;
            color: #495057;
            font-weight: 600;
        }
        
        .dt-buttons .btn {
            border-radius: 50px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="header-banner text-center">
        <h1 class="display-5 fw-bold"><i class="fas fa-flask me-3"></i>Dynamic Test Case Dashboard</h1>
        <p class="lead mb-0 mt-2">Payroll Management System | Team 11 | Academic Presentation</p>
    </div>

    <div class="container-fluid px-5">
        
        <div class="row mb-4 text-center">
            <div class="col-md-3">
                <div class="card card-glass py-3">
                    <h2 class="text-primary fw-bold" id="total-cases">73</h2>
                    <span class="text-muted text-uppercase small fw-bold">Total Test Cases</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-glass py-3">
                    <h2 class="text-success fw-bold">65</h2>
                    <span class="text-muted text-uppercase small fw-bold">Passed</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-glass py-3">
                    <h2 class="text-danger fw-bold">8</h2>
                    <span class="text-muted text-uppercase small fw-bold">Defects Found</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-glass py-3">
                    <h2 class="text-info fw-bold">99%</h2>
                    <span class="text-muted text-uppercase small fw-bold">Code Coverage</span>
                </div>
            </div>
        </div>

        <div class="card card-glass p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-secondary"><i class="fas fa-list-check me-2"></i>Test Execution Matrix</h4>
            </div>
            <div class="table-responsive">
                <table id="testCasesTable" class="table table-hover align-middle w-100">
                    <thead>
                        <tr>
                            <th>Test ID</th>
                            <th>Module</th>
                            <th>Technique</th>
                            <th>Test Scenario & Inputs</th>
                            <th>Expected Result</th>
                            <th>Actual Result</th>
                            <th>Defect Ref</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="testData">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- DataTables Buttons for Exporting (optional presentation flex) -->
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

    <script>
        // Sample dynamic dataset for the presentation
        const testCases = [
            { id: "TC-001", module: "Authentication", technique: "Positive", desc: "Login with valid admin credentials", expected: "Redirect to Dashboard", actual: "Redirected to Dashboard successfully", bug: "-", status: "Pass" },
            { id: "TC-002", module: "Authentication", technique: "BVA (Empty)", desc: "Login with empty fields", expected: "Show HTML5 required validation", actual: "Browser blocks form submission", bug: "-", status: "Pass" },
            { id: "TC-003", module: "Authentication", technique: "UI/UX", desc: "Verify Login button text", expected: "'Login to Dashboard'", actual: "'Logg In Dashbaord'", bug: "BUG-009", status: "Fail" },
            
            { id: "TC-010", module: "Employee Add", technique: "ECP (Valid)", desc: "Add employee with valid inputs", expected: "Success flash message (green)", actual: "Success flash message (red background)", bug: "BUG-011", status: "Fail" },
            { id: "TC-011", module: "Employee Add", technique: "BVA (Min Limit)", desc: "Basic Salary = 9999", expected: "Reject: Salary must be >= 10000", actual: "Rejected appropriately", bug: "-", status: "Pass" },
            { id: "TC-012", module: "Employee Add", technique: "BVA (Max Limit)", desc: "Basic Salary = 500000", expected: "Accept employee creation", actual: "Rejected: 'Must not exceed 500000'", bug: "BUG-001", status: "Fail" },
            { id: "TC-013", module: "Employee Add", technique: "ECP (Invalid Type)", desc: "Name = '12345' (Numeric only)", expected: "Reject name as invalid", actual: "Accepted name successfully", bug: "BUG-006", status: "Fail" },
            
            { id: "TC-020", module: "Attendance", technique: "BVA (Boundaries)", desc: "Working Days = 31, Present Days = 31", expected: "Accept attendance", actual: "Accepted attendance", bug: "-", status: "Pass" },
            { id: "TC-021", module: "Attendance", technique: "Cause-Effect Graphing", desc: "Condition: Leave=0 AND Present>Working (e.g. 30/28)", expected: "Reject attendance: Present > Working", actual: "Accepted attendance", bug: "BUG-002", status: "Fail" },
            { id: "TC-022", module: "Attendance", technique: "BVA (Negative)", desc: "Overtime = -5 hours", expected: "Reject negative overtime", actual: "Accepted negative overtime", bug: "BUG-007", status: "Fail" },
            
            { id: "TC-030", module: "Payroll Gen", technique: "Decision Table", desc: "Calculate Gross Salary", expected: "Gross = Basic + HRA + DA + Conveyance + Allowances", actual: "Conveyance omitted from final sum", bug: "BUG-003", status: "Fail" },
            { id: "TC-031", module: "Payroll Gen", technique: "Decision Table", desc: "Calculate Income Tax (Salary > 30k)", expected: "Tax = 20% of Gross", actual: "Tax calculated at 10%", bug: "BUG-005", status: "Fail" },
            { id: "TC-032", module: "Payroll Gen", technique: "Decision Table", desc: "Calculate Professional Tax", expected: "Tax = 200 if > 15k", actual: "Tax always returned 0", bug: "BUG-008", status: "Fail" },
            { id: "TC-033", module: "Payroll Gen", technique: "State Transition", desc: "Generate duplicate payroll for same month", expected: "Reject as duplicate", actual: "Rejected successfully", bug: "-", status: "Pass" },
            { id: "TC-034", module: "Payroll Gen", technique: "State Transition", desc: "Generate payroll for same month DIFFERENT year", expected: "Accept new payroll", actual: "Falsely rejected as duplicate", bug: "BUG-004", status: "Fail" },
            
            { id: "TC-040", module: "Dashboard", technique: "UI/UX", desc: "Verify Financial panel title", expected: "'Financial Overview'", actual: "'Paryoll Analytics'", bug: "BUG-010", status: "Fail" },
        ];

        $(document).ready(function() {
            // Populate table body
            const tbody = document.getElementById('testData');
            testCases.forEach(tc => {
                const statusBadge = tc.status === 'Pass' ? 
                    '<span class="badge badge-pass px-3 py-2 rounded-pill">Pass <i class="fas fa-check ms-1"></i></span>' : 
                    '<span class="badge badge-fail px-3 py-2 rounded-pill">Fail <i class="fas fa-times ms-1"></i></span>';
                
                const bugBadge = tc.bug !== '-' ? 
                    `<span class="badge bg-warning text-dark"><i class="fas fa-bug me-1"></i>${tc.bug}</span>` : 
                    '<span class="text-muted">-</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-secondary">${tc.id}</td>
                    <td><span class="badge bg-secondary">${tc.module}</span></td>
                    <td class="fst-italic text-muted">${tc.technique}</td>
                    <td>${tc.desc}</td>
                    <td class="text-success">${tc.expected}</td>
                    <td class="${tc.status === 'Fail' ? 'text-danger fw-semibold' : ''}">${tc.actual}</td>
                    <td>${bugBadge}</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });

            // Initialize DataTable
            $('#testCasesTable').DataTable({
                pageLength: 10,
                lengthMenu: [[5, 10, 25, -1], [5, 10, 25, "All"]],
                order: [], // keep initial array order
                dom: '<"row mb-3"<"col-md-6"B><"col-md-6"f>>rt<"row mt-3"<"col-md-6"i><"col-md-6"p>>',
                buttons: [
                    {
                        extend: 'csv',
                        className: 'btn btn-outline-primary btn-sm',
                        text: '<i class="fas fa-file-csv me-1"></i> Export CSV'
                    },
                    {
                        extend: 'excel',
                        className: 'btn btn-outline-success btn-sm',
                        text: '<i class="fas fa-file-excel me-1"></i> Export Excel'
                    }
                ],
                language: {
                    search: "<i class='fas fa-search text-muted'></i>",
                    searchPlaceholder: "Search test cases..."
                }
            });
            
            // Fix search bar styling
            $('.dataTables_filter input').addClass('form-control').css('display', 'inline-block').css('width', 'auto');
        });
    </script>
</body>
</html>
